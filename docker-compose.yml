version: '3.8'

services:
  keen-mix-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./uploads:/app/uploads
    networks:
      - keen-mix-network

  keen-mix-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - keen-mix-backend
    networks:
      - keen-mix-network

networks:
  keen-mix-network:
    driver: bridge

volumes:
  uploads:
